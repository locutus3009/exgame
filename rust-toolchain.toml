# The exact compiler this workspace is built and gated with. Pinned, not a
# channel: `stable` moves under you, and a lint that fires only on the newer
# compiler turns a green gate red without a code change. The same value is
# recorded in `config/quality-tools.json` under `rust.toolchain`; the two must
# be changed together.
#
# `rust-version` in `Cargo.toml` is the *minimum* this workspace compiles with
# and is deliberately the same value today: nothing older has been tested, so
# claiming a lower floor would be a guess.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy", "llvm-tools-preview"]
profile = "minimal"
